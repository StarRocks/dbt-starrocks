services:

  starrocks:
    image: starrocks/allin1-ubuntu:${STARROCKS_VERSION:-3.5.6}
    hostname: starrocks
    container_name: starrocks
    ports:
      - 8030:8030
      - 9030:9030
      - 8040:8040
    networks:
      iceberg_net:
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    healthcheck:
      test: 'mysql -u root -h 127.0.0.1 -P 9030 -e "SELECT 1"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: iceberg-rest
    networks:
      iceberg_net:
        aliases:
          - iceberg-rest.s3
    ports:
      - 8181:8181
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://s3:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true

  s3:
    image: chrislusf/seaweedfs:4.47
    container_name: s3
    networks:
      iceberg_net:
        aliases:
          - warehouse.s3
    ports:
      - 9000:9000
    # All-in-one SeaweedFS with its S3 gateway on 9000. The AWS_* variables
    # create the admin identity that the other services sign requests with.
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-s3.domainName=s3"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  create-bucket:
    depends_on:
      s3:
        condition: service_healthy
    image: amazon/aws-cli:2.37.4
    container_name: create-bucket
    networks:
      iceberg_net:
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://s3:9000 s3 mb s3://warehouse; do echo '...waiting...' && sleep 1; done;
      tail -f /dev/null
      "

networks:
  iceberg_net:
