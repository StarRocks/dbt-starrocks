name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        starrocks-version: ['3.5-latest', '4.0-latest', '4.1-latest']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install -r dev_requirements.txt
          uv pip install -e .

      - name: Start Iceberg stack
        run: docker compose -f .github/docker-compose.iceberg.yml up --detach --wait --wait-timeout 400
        env:
          STARROCKS_VERSION: ${{ matrix.starrocks-version }}

      # Run SQL with the mysql client bundled in the StarRocks image, so the
      # runner doesn't need its own (Ubuntu 26.04 dropped mysql-client 8.0).
      - name: Configure StarRocks and create Iceberg catalog
        run: |
          docker compose -f .github/docker-compose.iceberg.yml exec -T starrocks \
            mysql -h 127.0.0.1 -P 9030 -u root <<'SQL'
          ADMIN SET FRONTEND CONFIG ('default_replication_num' = '1');
          CREATE EXTERNAL CATALOG iceberg_catalog
          PROPERTIES (
            'type'='iceberg',
            'iceberg.catalog.type'='rest',
            'iceberg.catalog.uri'='http://iceberg-rest:8181',
            'iceberg.catalog.warehouse'='warehouse',
            'aws.s3.access_key'='admin',
            'aws.s3.secret_key'='password',
            'aws.s3.endpoint'='http://s3:9000',
            'aws.s3.enable_path_style_access'='true'
          );
          SQL

      - name: Run unit tests
        run: |
          source .venv/bin/activate
          uv run pytest tests/unit

      - name: Wait for StarRocks internal tables
        run: sleep 60

      - name: Run integration tests
        run: |
          source .venv/bin/activate
          uv run pytest tests/functional

      - name: Stop Iceberg stack
        if: always()
        run: docker compose -f .github/docker-compose.iceberg.yml down -v

  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [integration-test]
    steps:
      - name: Check matrix results
        run: |
          if [ "${{ needs.integration-test.result }}" != "success" ]; then
            echo "Integration tests failed"
            exit 1
          fi
